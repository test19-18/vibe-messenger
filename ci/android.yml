name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Analyze, test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Generate Android platform when absent
        shell: bash
        run: |
          set -euo pipefail

          if [[ -e android && ! -d android ]]; then
            echo 'android exists but is not a directory' >&2
            exit 1
          fi

          if [[ ! -d android ]]; then
            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT

            flutter create \
              --no-pub \
              --platforms=android \
              --org=ru.vibe \
              --project-name=vibe_messenger \
              "$temp_dir/vibe_messenger"

            cp -a "$temp_dir/vibe_messenger/android" ./android
          fi

          if [[ ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            echo 'Generated Android project has no settings.gradle(.kts)' >&2
            exit 1
          fi
          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo 'Generated Android project has no app/build.gradle(.kts)' >&2
            exit 1
          fi

      - name: Configure voice and biometric Android host
        run: python3 tool/configure_android.py .

      - name: Configure Firebase Android host
        run: python3 tool/configure_firebase_android.py .

      - name: Materialize Firebase Android config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo 'Missing required GitHub secret FIREBASE_GOOGLE_SERVICES_JSON_BASE64' >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Patch file_picker for AGP 9 compatibility mode
        run: python3 tool/patch_file_picker_agp9.py .

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --no-pub --reporter=expanded

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --debug \
            --no-pub \
            --dart-define=SUPABASE_URL="https://rcioqqtpslawjstrbqyh.supabase.co" \
            --dart-define=SUPABASE_ANON_KEY="sb_publishable_65s8V94B0rQB_C6FQyZT_Q_13QAltS4"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-debug-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest-debug
          name: Vibe latest debug APK
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          body: |
            Automated development build of «Вайб».
            This APK is for testing and is not a production-signed release.
