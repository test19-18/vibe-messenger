name: vibe_messenger
description: "Вайб — приватный Flutter-мессенджер с Supabase backend."
publish_to: none
version: 0.2.1+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  just_audio: ^0.10.6
  livekit_client: ^2.8.1
  local_auth: ^3.0.2
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  record: ^7.1.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
